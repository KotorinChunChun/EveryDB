[package]
name = "everydb"
version = "0.0.6"
description = "各種データソースをローカル SQLite にキャッシュして横断高速検索するツール"
authors = ["EveryDB"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "everydb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1.3"
calamine = "0.26"
walkdir = "2"
encoding_rs = "0.8"
anyhow = "1"
odbc-api = "29"
ureq = { version = "2", features = ["json", "cookies"] }
windows = { version = "0.61", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    # Windows Hello（PIN/生体認証）による本人確認。UserConsentVerifier + デスクトップアプリ用の
    # HWND インターop（IUserConsentVerifierInterop）に必要。
    "Security_Credentials_UI",
    "Win32_System_WinRT",
    "Foundation",
] }
# windows クレートの生成コードが返す IAsyncOperation<T> 等の待受け（.get()）に必要。
windows-future = "0.2"
tauri-plugin-autostart = "2.0.0-rc.1"
tauri-plugin-global-shortcut = "2.0.0-rc.2"
tauri-plugin-dialog = "2.0.0-rc.8"
tauri-plugin-fs = "2.0.0-rc.6"
jsonwebtoken = "9.3.1"
postgres = { version = "0.19.10", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql = "28.0.0"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
scraper = "0.27.0"
getrandom = "0.3"
base64 = "0.22"
hmac-sha256 = { version = "1.1.14", default-features = false }

[dev-dependencies]
rust_xlsxwriter = "0.79"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
